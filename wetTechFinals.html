<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>User Information Card</title>

    <link rel="stylesheet" href="webTechFinals.css" />
  </head>

  <body>
    <div class="container">
      <h1>User Information Card</h1>
      <p class="description">
        Enter your information below and click the "Show My Info".
      </p>

      <form id="userForm">
        <!-- 1.full name -->
        <div class="form-group">
          <label for="fullName">Full Name:</label>
          <input type="text" id="fullName" placeholder="Enter your full name" />
        </div>

        <!-- 2.email -->
        <div class="form-group">
          <label for="email">Email Address:</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <!-- 3.age -->
        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" placeholder="Enter your age" />
        </div>

        <!-- 4.address -->
        <div class="form-group">
          <label for="address">Address:</label>
          <input type="text" id="address" placeholder="Enter your address" />
        </div>

        <!-- 5.phone Number -->
        <div class="form-group">
          <label for="phone">Phone Number:</label>
          <input type="tel" id="phone" placeholder="Enter your phone number" />
        </div>

        <!-- 6.birthday -->
        <div class="form-group">
          <label for="birthday">Birthday:</label>
          <input type="date" id="birthday" />
        </div>

        <!-- 7.course -->
        <div class="form-group">
          <label for="course">Course:</label>
          <input type="text" id="course" placeholder="Enter your course" />
        </div>

        <!-- 8.School -->
        <div class="form-group">
          <label for="school">School:</label>
          <input type="text" id="school" placeholder="Enter your school" />
        </div>

        <!-- 9.fav volor -->
        <div class="form-group">
          <label for="favoriteColor">Favorite Color:</label>

          <select id="favoriteColor">
            <option value="">Select a color</option>
            <option value="Red">Red</option>
            <option value="Blue">Blue</option>
            <option value="Green">Green</option>
            <option value="Yellow">Yellow</option>
            <option value="Purple">Purple</option>
            <option value="Orange">Orange</option>
          </select>
        </div>

        <!-- 10.gender -->
        <div class="form-group">
          <label>Gender:</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="gender" value="Male" />
              Male
            </label>

            <label>
              <input type="radio" name="gender" value="Female" />
              Female
            </label>

            <label>
              <input type="radio" name="gender" value="Other" />
              Other
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Hobbies:</label>

          <div class="checkbox-group">
            <label>
              <input type="checkbox" class="hobby" value="Gaming" />
              Gaming
            </label>

            <label>
              <input type="checkbox" class="hobby" value="Reading" />
              Reading
            </label>

            <label>
              <input type="checkbox" class="hobby" value="Sports" />
              Sports
            </label>

            <label>
              <input type="checkbox" class="hobby" value="Music" />
              Music
            </label>
          </div>
        </div>

        <button type="button" id="showInfo">Show My Info</button>
      </form>

      <div class="output-section">
        <h2>My Information</h2>

        <div id="output">
          <p>Your information will appear here.</p>
        </div>
      </div>
    </div>

    <script src="webTechFinals.js"></script>
  </body>
</html>
